name: Worker Mining Repair

on: push

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker mining reset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/page.tsx")
          s = p.read_text()
          old = """    worker.patrol = undefined;
    worker.retreating = false;
    if (worker.stance === \"patrol\") worker.stance = \"pursue\";
"""
          new = """    worker.patrol = undefined;
    // A direct resource order overrides stale movement, combat, retreat, and maintenance state.
    worker.retreating = false;
    worker.moveEngage = false;
    worker.formationSpeed = undefined;
    worker.garrisonTarget = undefined;
    worker.lastCombatAt = undefined;
    worker.mining = false;
    worker.building = false;
    worker.repairing = false;
    if (worker.stance === \"patrol\") worker.stance = \"pursue\";
"""
          if s.count(old) != 1:
              raise SystemExit("Expected exactly one worker mining assignment block")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "Frontier Command Repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix workers resuming mining after other duties"
          git push
